# ============================================================================
# deploy.yml - deploy this repository to the Google Cloud resources of your team
# Save as: .github/workflows/deploy.yml  (the file name and the branch main must stay exactly like this)
#
# How it works
#   - Triggers: push to main, or run it by hand (workflow_dispatch).
#   - It signs in to Google Cloud with Workload Identity Federation (WIF): no key file, no secret in GitHub.
#   - It builds the Dockerfile at the root of the repository, pushes the image to your team's Artifact Registry
#     repository and deploys it to your team's Cloud Run service.
#
# Do not rename (the portal WIF rule is bound to these):
#   - this file name deploy.yml on branch main
#   - environment: demo   (create it in GitHub: Settings -> Environments -> New environment -> demo)
#   - permissions id-token: write
#
# Changes from the portal's file (issue #49), everything else is as downloaded:
#   - builds a second image from the Dockerfile target `migrate` (Prisma CLI) and runs the migration with it,
#     because the default `runtime` image is production-only and does not contain Prisma;
#   - the migration always runs (SDS 9.3) and the deploy only happens if it succeeds;
#   - adds a smoke check after the deploy (health, and login + one read when SMOKE_EMAIL / SMOKE_PASSWORD are set).
#
# Set these four variables in the GitHub environment demo (values: portal, Team resources tab):
#   GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT
# Optional variables:
#   APP_PORT         port your container listens on if it is not 8080 (bunnyfit listens on 8080: leave unset)
#   SMOKE_EMAIL      (variable) e-mail of a dedicated read-only test account, and
#   SMOKE_PASSWORD   (secret in the environment demo) its password. Set both or neither.
# ============================================================================
name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    environment: demo
    permissions:
      contents: read
      id-token: write # required for the keyless Google Cloud sign-in (WIF)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # Names of your team's resources (assigned by the portal)
      SERVICE_NAME: s27d6b925
      MIGRATE_JOB_NAME: s27d6b925-migrate
      AR_REPOSITORY: s27d6b925
      IMAGE_NAME: s27d6b925
      APP_PORT: ${{ vars.APP_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check settings and Dockerfile
        env:
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
        run: |
          for name in PROJECT_ID REGION WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            [ -n "${!name}" ] || { echo "Missing GitHub variable for $name (see the portal, Team resources tab)"; exit 1; }
          done
          [ -f Dockerfile ] || { echo 'No Dockerfile at the root of the repository'; exit 1; }

      - name: Sign in to Google Cloud (no key file)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push the images (runtime and migrate)
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          BASE="$REGION-docker.pkg.dev/$PROJECT_ID/$AR_REPOSITORY/$IMAGE_NAME"
          echo "IMAGE=$BASE:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=$BASE:migrate-$GITHUB_SHA" >> "$GITHUB_ENV"
          docker build --tag "$BASE:$GITHUB_SHA" .
          docker build --target migrate --tag "$BASE:migrate-$GITHUB_SHA" .
          docker push "$BASE:$GITHUB_SHA"
          docker push "$BASE:migrate-$GITHUB_SHA"

      # Runs `prisma migrate deploy` (package.json db:migrate) in the team's migrate job with the migrate image.
      # The job already has the Cloud SQL connection and DATABASE_URL from the portal; only image and command change.
      # The deploy below only happens if the migration succeeds (--wait fails the step otherwise).
      - name: Run database migration
        run: |
          gcloud run jobs update "$MIGRATE_JOB_NAME" --image "$MIGRATE_IMAGE" --region "$REGION" --project "$PROJECT_ID" \
            --command=pnpm --args=run,db:migrate --quiet
          gcloud run jobs execute "$MIGRATE_JOB_NAME" --region "$REGION" --project "$PROJECT_ID" --wait

      - name: Deploy to Cloud Run
        run: |
          PORT_ARGS=()
          if [ -n "$APP_PORT" ]; then PORT_ARGS=(--port "$APP_PORT"); fi
          gcloud run deploy "$SERVICE_NAME" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" "${PORT_ARGS[@]}" --quiet

      - name: Smoke check (read-only)
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          URL="$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          echo "URL=$URL" >> "$GITHUB_ENV"
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL/api/health" | grep -q '"status":"ok"'; then ok=1; break; fi
            echo "health not ready (attempt $i), waiting"; sleep 10
          done
          [ "$ok" = 1 ] || { echo 'Smoke check failed: /api/health did not return {"status":"ok"}'; exit 1; }
          echo "health: ok"
          if [ -n "$SMOKE_EMAIL" ] && [ -n "$SMOKE_PASSWORD" ]; then
            TOKEN="$(jq -n --arg e "$SMOKE_EMAIL" --arg p "$SMOKE_PASSWORD" '{email:$e,password:$p}' \
              | curl -fsS -X POST "$URL/api/auth/login" -H 'Content-Type: application/json' --data @- | jq -r .token)"
            [ -n "$TOKEN" ] && [ "$TOKEN" != null ] || { echo 'Smoke check failed: login returned no token'; exit 1; }
            echo "::add-mask::$TOKEN"
            curl -fsS "$URL/api/categories" -H "Authorization: Bearer $TOKEN" | jq -e 'type == "array" and length > 0' >/dev/null \
              || { echo 'Smoke check failed: could not read persisted data (/api/categories)'; exit 1; }
            echo "login and persisted read: ok"
          elif [ -n "$SMOKE_EMAIL$SMOKE_PASSWORD" ]; then
            echo 'Set both SMOKE_EMAIL (variable) and SMOKE_PASSWORD (secret), or neither'; exit 1
          else
            echo "login and persisted read: skipped (SMOKE_EMAIL / SMOKE_PASSWORD not set)"
          fi

      - name: Summary
        run: |
          {
            echo '### Deployed'
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Migrate image: \`$MIGRATE_IMAGE\`"
            echo "- URL: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
