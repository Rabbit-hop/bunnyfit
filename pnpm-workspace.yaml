# pnpm workspace/repo config.
# Security posture: third-party build scripts are disabled by default — esbuild
# ships its binary via optional dependencies, so its postinstall is not needed.
# Prisma's build scripts are allowed because the client/engines must be
# generated/downloaded for `prisma generate` and the seed to work.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: false
  prisma: true
